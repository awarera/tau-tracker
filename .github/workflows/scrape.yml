name: TAU Daily Scraper

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 08:00 Nairobi (EAT)
  workflow_dispatch:       # manual trigger from Actions tab

permissions:
  contents: write          # needed to commit data/ back to repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data files
        run: |
          git config user.name  "TAU Scraper Bot"
          git config user.email "bot@tau-tracker.noreply"
          git add data/
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "scraper: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
